{% extends "base.html" %}

{% block content %}
  <h1>Login</h1>
  {% if form.errors %}
    <p>Incorrect username or password.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next != "/accounts/logout/" %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <input type="submit" value="Submit">
  </form>
{% endblock %}
