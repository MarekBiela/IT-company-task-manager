<ul>
  {% if user.is_authenticated %}
  <li>User: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a></li>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  {% else %}
    <li><a href="{% url 'login' %}">Login</a></li>
  {% endif %}
  <br>
  <li><a href="{% url 'tasks:index' %}">Home</a></li>
  <li><a href="{% url 'tasks:task-list' %}">All tasks</a></li>
  <li><a href="{% url 'tasks:worker-list' %}">All workers</a></li>
  <li><a href="{% url 'tasks:task-type-list' %}">All task types</a></li>
  <li><a href="{% url 'tasks:position-list' %}">All positions</a></li>
</ul>
