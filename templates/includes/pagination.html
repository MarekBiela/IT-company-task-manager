{% load query_transform %}

{% if is_paginated %}
  <ul class="d-flex list-unstyled">
    {% if page_obj.has_previous %}
      <li>
        <a href="?{% query_transform request page=page_obj.previous_page_number %}" class="text-c-green mb-0">prev &nbsp;</a>
      </li>
    {% endif %}
    <li>
      {{ page_obj.number }} of {{ paginator.num_pages }} &nbsp;
    </li>
    {% if page_obj.has_next %}
      <li>
        <a href="?{% query_transform request page=page_obj.next_page_number %}" class="text-c-green mb-0">next</a>
      </li>
    {% endif %}
  </ul>
{% endif %}
