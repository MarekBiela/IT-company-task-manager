{% extends "base.html" %}

{% block content %}
  <h1>
    Position List
    <a href="{% url 'tasks:position-create' %}">
      Create
    </a>
  </h1>
  {% if position_list %}
    <ul>
      {% for position in position_list %}
        <li>
          {{ position.id }}
          {{ position.name }}
          <a href="{% url 'tasks:position-update' pk=position.id %}">
            Update
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No positions have been added yet.</p>
  {% endif %}
{% endblock %}
