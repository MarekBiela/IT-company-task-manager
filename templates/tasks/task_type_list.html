{% extends "base.html" %}

{% block content %}
  <h1>
     Task Type List
      <a href="{% url 'tasks:task-type-create' %}">
        Create
      </a>
  </h1>
  {% if task_type_list %}
    <ul>
      {% for task_type in task_type_list %}
        <li>
          {{ task_type.id }}
          {{ task_type.name }}
          <a href="{% url 'tasks:task-type-update' pk=task_type.id %}">
            Update
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No task types have been added yet.</p>
  {% endif %}
{% endblock %}
